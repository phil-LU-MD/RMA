name: Publish and Backup

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render allies
        run: |
          cd RMA/allies
          quarto render

      - name: Render pol_dev_LA
        run: |
          cd RMA/pol_dev_LA
          quarto render

      - name: Render PhD PDF
        run: |
          cd RMA/PhD
          quarto render PhD.qmd

      - name: Prepare Pages output
        run: |
          mkdir -p pages_output
          cp -r RMA/allies pages_output/
          cp -r RMA/pol_dev_LA pages_output/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload websites to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages_output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhD-PDF
          path: 'RMA/PhD/PhD.pdf'
