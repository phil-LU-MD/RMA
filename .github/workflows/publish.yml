name: Publish Quarto projects

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          mkdir -p _site

          rsync -a --prune-empty-dirs \
            --exclude='.Rproj.user' \
            --exclude='.Rhistory' \
            --exclude='.Rprofile' \
            --exclude='.DS_Store' \
            --exclude='renv' \
            --exclude='renv.lock' \
            --exclude='*.Rproj' \
            allies/ _site/allies/

          rsync -a --prune-empty-dirs \
            --exclude='.Rproj.user' \
            --exclude='.Rhistory' \
            --exclude='.Rprofile' \
            --exclude='.DS_Store' \
            --exclude='renv' \
            --exclude='renv.lock' \
            --exclude='*.Rproj' \
            pol_dev_LA/ _site/pol_dev_LA/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>RMA projects</title>
          </head>
          <body>
            <h1>RMA projects</h1>
            <ul>
              <li><a href="allies/">Allies</a></li>
              <li><a href="pol_dev_LA/">Political Development LA</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
